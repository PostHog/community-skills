name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      # Validate by building: parses every skill (failing on bad frontmatter, symlinks, oversize or
      # non-text files, etc.) without requiring contributors to hand-commit registry.json. The
      # publish-registry job below regenerates and commits it on pushes to main, so the catalog stays
      # fresh and PRs (including in-product "Publish to community" PRs) only need to add SKILL.md.
      - name: Validate skills
        run: python scripts/build_registry.py

      - name: Safety scan (prompt-injection heuristics)
        run: python scripts/safety_scan.py

  # On main, regenerate and commit registry.json so PostHog's sync sees the latest.
  publish-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python scripts/build_registry.py
      - name: Check whether the registry changed
        id: changes
        run: |
          if git diff --quiet registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits through the GitHub API so it carries GitHub's signature, which the
      # org-wide signed-commits ruleset requires. A plain `git push` is rejected.
      - name: Commit updated registry
        if: steps.changes.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: 'chore: rebuild registry.json'
          repo: ${{ github.repository }}
          branch: main
          file_pattern: registry.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
